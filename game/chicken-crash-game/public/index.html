<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chicken Crash - Galaxsys Official 3D Experience</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="standalone-game-app">
    <!-- Header -->
    <header class="game-top-header">
      <div class="header-left">
        <a href="../../index.html" class="lobby-back-btn" title="Back to Lobby">← Lobby</a>
        <img src="img/gameLogo.webp" class="game-header-logo" alt="Chicken Crash">
        <div class="header-user-info">
          <div class="game-id-badge">ID: <strong id="headerRoundId">808695615</strong></div>
          <div class="game-balance-badge" id="hudUserBalance">
            <span>💰</span>
            <span id="userBalanceText">0.00 ETB</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button class="header-icon-btn" id="btnSoundToggle" title="Mute/Unmute Audio">
          <svg id="iconSoundOn" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="iconSoundOff" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: none;">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>

        <button class="ingame-dots-settings-btn" id="btnIngameDots" title="Game Settings">
          <span>•••</span>
        </button>
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="game-viewport-wrapper">
      <!-- Game Canvas Area -->
      <section class="game-canvas-area">
        <canvas id="chickenCanvas"></canvas>

        <!-- Traffic Light Risk Level -->
        <div class="traffic-light-selector">
          <button class="traffic-lamp active easy" data-risk="EASY">
            <span class="lamp-lens green"></span>
            <span>EASY</span>
          </button>
          <button class="traffic-lamp medium" data-risk="MEDIUM">
            <span class="lamp-lens yellow"></span>
            <span>MED</span>
          </button>
          <button class="traffic-lamp hard" data-risk="HARD">
            <span class="lamp-lens red"></span>
            <span>HARD</span>
          </button>
        </div>

        <!-- Docked Betting Controller -->
        <div class="ingame-bet-controller" id="ingameBetController">
          <!-- IDLE VIEW: Stepper & Quick Chips -->
          <div class="controller-inner-left" id="controllerIdleView">
            <div class="bet-stepper-box">
              <button class="stepper-arrow-btn" id="btnBetMinus" title="Decrease Bet">⬇</button>
              <div class="stepper-amount-slot">
                <span class="stepper-amount" id="betAmountDisplay">6</span>
                <span class="stepper-currency">ETB</span>
                <input type="hidden" id="betAmountInput" value="6.00">
              </div>
              <button class="stepper-arrow-btn" id="btnBetPlus" title="Increase Bet">⬆</button>
            </div>

            <div class="quick-bet-chips">
              <button class="chip-btn" data-action="2x">2X</button>
              <button class="chip-btn" data-action="4x">4X</button>
              <button class="chip-btn" data-action="allin">ALL IN</button>
            </div>
          </div>

          <!-- RUNNING VIEW: Collect, Flip & Step -->
          <div class="controller-running-view" id="controllerRunningView" style="display: none;">
            <div class="controller-collect-wrapper">
              <button class="btn-action-collect" id="btnActionCollect">
                <span class="collect-title">COLLECT</span>
                <span class="collect-amount" id="liveCollectVal">6.90 ETB</span>
              </button>
            </div>

            <button class="btn-flip-mode" id="btnFlipMode" title="Toggle Multiplier / ETB Mode">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/>
              </svg>
            </button>
          </div>

          <!-- Big Tire-Bezel Action GO! Button -->
          <div class="controller-go-wrapper">
            <button class="btn-action-go" id="btnActionGo">
              <span>GO!</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Desktop Sidebar with Live Players Table -->
      <aside class="game-sidebar-column">
        <div class="sidebar-top-header">
          <span class="sidebar-title">Live Players</span>
          <span class="sidebar-clock" id="ingameClock">12:00</span>
        </div>
        <div class="players-table-wrapper custom-scrollbar">
          <table class="players-table">
            <thead>
              <tr>
                <th>Player</th>
                <th>Bet</th>
                <th>Win</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="livePlayersTableBody">
              <tr>
                <td>35***63</td>
                <td>27.60 ETB</td>
                <td class="win">31.74 ETB</td>
                <td>12:01</td>
              </tr>
              <tr>
                <td>64***98</td>
                <td>10.00 ETB</td>
                <td class="win">14.50 ETB</td>
                <td>12:01</td>
              </tr>
              <tr>
                <td>AT***vd</td>
                <td>150.00 ETB</td>
                <td class="win">420.00 ETB</td>
                <td>12:00</td>
              </tr>
              <tr>
                <td>e3***64</td>
                <td>6.00 ETB</td>
                <td class="win">7.80 ETB</td>
                <td>12:00</td>
              </tr>
              <tr>
                <td>18***02</td>
                <td>20.00 ETB</td>
                <td class="win">58.00 ETB</td>
                <td>11:59</td>
              </tr>
            </tbody>
          </table>
        </div>
      </aside>
    </main>
  </div>

  <!-- Unified Shared Balance & Game Scripts -->
  <script src="../../shared-balance.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
