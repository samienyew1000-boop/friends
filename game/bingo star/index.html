<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#160b3a" />
  <title>Bingo Star</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bs-root">
    <div class="bs-frame">
      <a href="../../index.html" style="position:absolute;top:10px;left:10px;z-index:99;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:rgba(0,0,0,0.6);color:#fff;text-decoration:none;font-size:0.8rem;font-weight:700;border:1px solid rgba(255,255,255,0.2);" title="Back to Lobby">&larr; Lobby</a>
      <div class="bs-logo" aria-hidden="true" style="margin-left:80px;">Bingo <span>STAR</span></div>

      <main class="bs-main">
        <div class="bs-patterns" id="patterns"></div>
        <div class="bs-cards" id="cards"></div>
        <div class="bs-status" id="status">Pick tickets, then DRAW</div>
        <div class="bs-drawn" id="drawn"></div>
      </main>

      <footer class="bs-bar">
        <img src="assets/balls/blue.svg" alt="" class="bs-decoball is-left" />

        <div class="bs-panel-wrap">
          <div class="bs-bet-panel">
            <div class="bs-bet-top">
              <div>MAKE YOUR BET</div>
              <div class="bs-bet-total">TOTAL BET <span id="totalbet-val">24</span> ETB</div>
            </div>
            <div class="bs-bet-controls">
              <div class="bs-bet-stepper">
                <button type="button" id="minus">−</button>
                <input id="bet" type="number" min="1" max="400" value="6" readonly />
                <button type="button" id="plus">+</button>
              </div>
              <div class="bs-bet-hot">
                <button type="button" class="bs-hot">+6</button>
                <button type="button" class="bs-hot">+60</button>
                <button type="button" class="bs-hot">+120</button>
              </div>
            </div>
          </div>

          <button type="button" class="bs-spin-btn" id="draw">
            <img src="assets/desktop/spinIcon.webp" alt="Spin" />
          </button>
          <button type="button" class="bs-auto-btn" id="auto">
            <img src="assets/mobile/autoBetBig.webp" alt="Auto" />
          </button>
        </div>

        <img src="assets/balls/purple.svg" alt="" class="bs-decoball is-right" />
      </footer>

      <aside class="bs-side" id="side-panel">
        <div class="bs-side-head">
          <span class="bs-bal" id="balance">10 000</span>
          <span class="bs-unit">ETB</span>
          <span class="bs-clock" id="clock">--:--</span>
        </div>

        <div class="bs-side-tabs">
          <button type="button" class="bs-side-tab is-active" data-tab="players">Players</button>
          <button type="button" class="bs-side-tab" data-tab="history">History</button>
          <button type="button" class="bs-side-tab" data-tab="top">Top</button>
        </div>
        <div class="bs-side-cols">
          <span>Player</span><span>Bet</span><span>Win</span><span>Time</span>
        </div>
        <div class="bs-side-rows" id="side-rows"></div>
      </aside>
      <button type="button" class="bs-side-toggle" id="side-toggle">≡</button>
    </div>

    <div class="bs-bonus" id="bonus-modal" hidden>
      <div class="bs-bonus-card">
        <div class="bs-bonus-title">BONUS STAR</div>
        <div class="bs-bonus-sub">Pick a cell</div>
        <div class="bs-bonus-grid" id="bonus-grid"></div>
        <div class="bs-bonus-result" id="bonus-result"></div>
        <button type="button" class="bs-bonus-close" id="bonus-close" hidden>COLLECT</button>
      </div>
    </div>
  </div>
  <script src="../shared-balance.js"></script>
  <script src="game.js"></script>
</body>

</html>
