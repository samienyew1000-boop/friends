<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Multi Hot 5 Deluxe - SmartSoft Gaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;0,900;1,900&family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@500;700&family=Playball&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #011208;
        font-family: 'Poppins', sans-serif;
        color: #ffffff;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: radial-gradient(circle at center, rgba(3, 45, 25, 0.45) 0%, rgba(1, 14, 8, 0.95) 100%), url('./assets/background.jpg') center center / cover no-repeat;
      }

      /* =========================================================
         DESKTOP LANDSCAPE VIEW
         ========================================================= */
      #top-header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 24px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 14px;
        letter-spacing: 1px;
        color: #ffffff;
      }

      .brand-title span.red-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ff3344;
        display: inline-block;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .digital-clock {
        font-family: 'Roboto Mono', monospace;
        font-size: 15px;
        font-weight: 700;
        color: #e0e0e0;
      }

      .menu-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .menu-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }

      .menu-btn span {
        display: block;
        width: 18px;
        height: 2px;
        background-color: #ffffff;
        border-radius: 2px;
      }

      #game-viewport {
        position: relative;
        width: 100%;
        height: calc(100% - 48px);
        margin-top: 48px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #game-canvas {
        display: block;
      }

      /* =========================================================
         AUTHENTIC MOBILE PORTRAIT VIEW (Matches Reference Image)
         ========================================================= */
      #mobile-shell {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        padding-left: 12px;
        padding-right: 12px;
        z-index: 50;
        background: radial-gradient(circle at 50% 35%, rgba(5, 52, 28, 0.4) 0%, rgba(1, 14, 8, 0.94) 85%), url('./assets/background.jpg') center center / cover no-repeat;
      }

      /* Mobile Top Bar */
      .mobile-top-bar {
        width: 100%;
        max-width: 440px;
        height: 38px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 8px;
      }

      .mobile-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .smartsoft-logo-icon {
        width: 20px;
        height: 20px;
        filter: drop-shadow(0 0 6px rgba(255, 42, 85, 0.6));
      }

      .smartsoft-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
        color: #ffffff;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      }

      .mobile-clock {
        font-family: 'Roboto Mono', monospace;
        font-size: 13.5px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 1px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      }

      /* Mobile Game Title (Fiery Multi Hot 5 Deluxe) */
      .mobile-game-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        margin-top: -2px;
        margin-bottom: 2px;
      }

      .title-main {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }

      .word-multi, .word-hot {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 2px;
        background: linear-gradient(180deg, #fffadb 0%, #ffd74a 35%, #ff9500 70%, #d84500 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 10px rgba(255,149,0,0.8));
      }

      .num-5 {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 38px;
        line-height: 1;
        margin-left: 2px;
        background: linear-gradient(180deg, #ffc2d1 0%, #ff2a55 45%, #b80028 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 14px rgba(255,42,85,0.9));
      }

      .title-deluxe {
        position: absolute;
        right: -16px;
        bottom: -10px;
        font-family: 'Playball', 'Brush Script MT', cursive, sans-serif;
        font-size: 24px;
        color: #ff1361;
        text-shadow: 0 0 8px #ff1361, 0 0 16px #ff1361, 1px 1px 2px #000;
        transform: rotate(-7deg);
        letter-spacing: 1px;
      }

      /* Mobile Slot Frame */
      .mobile-slot-frame {
        width: 100%;
        max-width: 396px;
        aspect-ratio: 1000 / 680;
        border: 2px solid #e0ba4a;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(224, 186, 74, 0.4), inset 0 0 16px rgba(0, 0, 0, 0.9);
        background: rgba(2, 24, 13, 0.88);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      .mobile-slot-frame canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
      }

      /* Mobile Circular Controls */
      .mobile-controls-row {
        width: 100%;
        max-width: 396px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 22px;
        margin: 6px 0;
      }

      /* Circular Side Buttons (AutoPlay & Bet) */
      .ctrl-circle-btn {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #134629 0%, #031c10 85%);
        border: 2px solid rgba(224, 186, 74, 0.65);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e5cf85;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .ctrl-circle-btn:active {
        transform: scale(0.92);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      .ctrl-circle-btn.active {
        border-color: #00e676;
        box-shadow: 0 0 16px #00e676, inset 0 0 8px rgba(0, 230, 118, 0.4);
        color: #00e676;
      }

      .bet-symbol {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 24px;
        background: linear-gradient(180deg, #fff7c2 0%, #ffd23f 60%, #c49514 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
      }

      /* Large Center HOLD & SPIN Button */
      .spin-btn-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ctrl-spin-btn {
        width: 108px;
        height: 108px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #0b341f 0%, #02170d 100%);
        border: 3px solid #e0ba4a;
        box-shadow: 0 0 22px rgba(224, 186, 74, 0.5), inset 0 0 14px rgba(0, 0, 0, 0.85);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: transform 0.12s ease;
      }

      .ctrl-spin-btn:active {
        transform: scale(0.94);
        box-shadow: 0 0 28px rgba(224, 186, 74, 0.8);
      }

      .spin-arrows-svg {
        position: absolute;
        inset: 4px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        pointer-events: none;
        transition: transform 0.4s ease;
      }

      .ctrl-spin-btn.spinning .spin-arrows-svg {
        animation: rotateArrows 1s linear infinite;
      }

      @keyframes rotateArrows {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .spin-inner-plate {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1.1;
        z-index: 2;
      }

      .txt-hold, .txt-spin {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 13.5px;
        letter-spacing: 1.5px;
        color: #fcf9ee;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      }

      .txt-amp {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 10.5px;
        color: #e0ba4a;
        margin: 1px 0;
      }

      /* Attached Turbo Button */
      .ctrl-turbo-btn {
        position: absolute;
        top: -2px;
        right: 0px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #184c30, #031c10 85%);
        border: 1.5px solid rgba(224, 186, 74, 0.7);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e5cf85;
        cursor: pointer;
        z-index: 5;
        transition: all 0.2s ease;
      }

      .ctrl-turbo-btn:active {
        transform: scale(0.9);
      }

      .ctrl-turbo-btn.active {
        border-color: #ffd23f;
        box-shadow: 0 0 12px #ffd23f;
        color: #ffd23f;
        background: radial-gradient(circle at 35% 35%, #423805, #171302 85%);
      }

      /* Mobile Bottom Bar (Pills & Icons) */
      .mobile-bottom-bar {
        width: 100%;
        max-width: 440px;
        height: 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 6px;
        box-sizing: border-box;
      }

      .mobile-bar-icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: transparent;
        border: none;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.12s ease;
      }

      .mobile-bar-icon-btn:active {
        transform: scale(0.9);
      }

      .mobile-pill {
        background: rgba(4, 28, 16, 0.9);
        border: 1.5px solid rgba(224, 186, 74, 0.55);
        border-radius: 20px;
        padding: 3px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.5);
        min-width: 120px;
      }

      .mobile-pill.bet-pill {
        cursor: pointer;
        transition: border-color 0.2s ease;
      }

      .mobile-pill.bet-pill:active {
        border-color: #ffd23f;
        transform: scale(0.97);
      }

      .pill-label {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 9.5px;
        letter-spacing: 1px;
        color: #e0ba4a;
        line-height: 1.1;
      }

      .pill-value {
        font-family: 'Roboto Mono', monospace;
        font-weight: 700;
        font-size: 13.5px;
        color: #ffffff;
        line-height: 1.2;
      }

      /* =========================================================
         MODAL / QUICK BET BOTTOM SHEET
         ========================================================= */
      .mobile-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .mobile-modal-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .mobile-bet-sheet {
        width: 100%;
        max-width: 440px;
        background: radial-gradient(circle at top, #0c3e23 0%, #031a0e 100%);
        border-top: 2px solid #e0ba4a;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -10px 30px rgba(0,0,0,0.85);
        padding: 20px;
        box-sizing: border-box;
      }

      .bet-sheet-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 1.5px;
        color: #e0ba4a;
        margin-bottom: 16px;
      }

      .close-sheet-btn {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 28px;
        cursor: pointer;
        line-height: 1;
      }

      .bet-stepper-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(224, 186, 74, 0.35);
        border-radius: 12px;
        padding: 6px 12px;
        margin-bottom: 16px;
      }

      .stepper-btn {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: rgba(224, 186, 74, 0.15);
        border: 1px solid rgba(224, 186, 74, 0.4);
        color: #ffd23f;
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .stepper-btn:active {
        background: rgba(224, 186, 74, 0.35);
      }

      .sheet-bet-value {
        font-family: 'Roboto Mono', monospace;
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
      }

      .quick-bets-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        max-height: 220px;
        overflow-y: auto;
      }

      .quick-bet-chip {
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.12);
        color: #d0e5d8;
        font-family: 'Roboto Mono', monospace;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 4px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .quick-bet-chip:active {
        transform: scale(0.95);
      }

      .quick-bet-chip.active {
        background: rgba(224, 186, 74, 0.25);
        border-color: #ffd23f;
        color: #ffd23f;
        box-shadow: 0 0 10px rgba(255, 210, 63, 0.3);
      }

      /* Win Announcement Banner */
      .mobile-win-banner {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at center, #ffe066 0%, #ff9500 60%, #b83200 100%);
        border: 2px solid #ffffff;
        border-radius: 14px;
        padding: 12px 28px;
        box-shadow: 0 0 35px rgba(255, 180, 0, 0.9), 0 8px 24px rgba(0,0,0,0.9);
        z-index: 200;
        pointer-events: none;
        animation: winPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .mobile-win-banner.hidden {
        display: none;
      }

      @keyframes winPop {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }

      .win-banner-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .win-banner-label {
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #4a1500;
      }

      .win-banner-amount {
        font-family: 'Roboto Mono', monospace;
        font-size: 24px;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 2px 4px #000, 0 0 8px #ff2a55;
      }

      /* =========================================================
         RESPONSIVE ORIENTATION SWITCHING
         ========================================================= */
      @media (max-width: 768px), (orientation: portrait) {
        #top-header {
          display: none !important;
        }
        #game-viewport {
          display: none !important;
        }
        #mobile-shell {
          display: flex !important;
        }
      }

      @media (min-width: 769px) and (orientation: landscape) {
        #top-header {
          display: flex !important;
        }
        #game-viewport {
          display: flex !important;
        }
        #mobile-shell {
          display: none !important;
        }
      }

      /* Utility classes */
      .hidden {
        display: none !important;
      }

      /* Preloader Overlay */
      #preloader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #083822 0%, #03170e 80%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        transition: opacity 0.5s ease;
      }

      #preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader-logo {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: 3px;
        color: #ffd23f;
        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 210, 63, 0.4);
        margin-bottom: 24px;
      }

      .loader-logo span {
        color: #ff2a7a;
      }

      .progress-container {
        width: 280px;
        height: 10px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        border: 1px solid rgba(255, 215, 0, 0.3);
        overflow: hidden;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff2a7a, #ffd23f);
        border-radius: 6px;
        transition: width 0.15s ease-out;
      }

      .progress-text {
        margin-top: 12px;
        font-size: 13px;
        color: #a0c4ab;
        letter-spacing: 1px;
      }

      /* Drawer Modal Styles */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        z-index: 1500;
        display: flex;
        justify-content: flex-end;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .modal-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .drawer-container {
        width: 600px;
        max-width: 92vw;
        height: 100%;
        background: radial-gradient(circle at top right, #093c23 0%, #03180f 80%, #010c07 100%);
        border-left: 2px solid rgba(255, 210, 63, 0.4);
        box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        transform: translateX(0);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .modal-overlay.hidden .drawer-container {
        transform: translateX(100%);
      }

      .drawer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 210, 63, 0.2);
        background: rgba(0, 0, 0, 0.35);
      }

      .drawer-tabs {
        display: flex;
        gap: 8px;
      }

      .tab-btn {
        background: transparent;
        border: 1px solid transparent;
        color: #8da698;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 1px;
        cursor: pointer;
        padding: 8px 14px;
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      .tab-btn:hover {
        color: #ffffff;
      }

      .tab-btn.active {
        background: rgba(255, 210, 63, 0.15);
        border-color: rgba(255, 210, 63, 0.4);
        color: #ffd23f;
      }

      .close-btn {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 32px;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
      }

      .drawer-content {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }

      .tab-pane {
        display: none;
      }

      .tab-pane.active {
        display: block;
      }

      .section-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #58c38a;
        border-bottom: 1px solid rgba(88, 195, 138, 0.2);
        padding-bottom: 8px;
        margin-bottom: 16px;
      }

      .paytable-grid {
        display: grid;

        height: 0;

        position: absolute;

        inset: 0;
        background-color: #274334;

      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;

        transition: 0.3s;
