<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tower Dash - Galaxsys Official 3D Experience</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="standalone-game-app">
    <!-- Header -->
    <header class="game-top-header">
      <div class="header-left">
        <a href="../../index.html" class="lobby-back-btn" title="Back to Lobby">← Lobby</a>
        <div class="game-header-title">
          <span class="game-header-logo-icon">🏗️</span>
          <span>TOWER DASH</span>
        </div>
        <div class="header-user-info">
          <div class="game-id-badge">ID: <strong id="headerRoundId">80894217</strong></div>
          <div class="game-balance-badge" id="hudUserBalance">
            <span>💰</span>
            <span id="userBalanceText">0.00 ETB</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button class="header-icon-btn" id="btnSoundToggle" title="Mute/Unmute Audio">
          <svg id="iconSoundOn" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="iconSoundOff" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: none;">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="game-viewport-wrapper">
      <!-- Game Canvas Area -->
      <section class="game-canvas-area">
        <canvas id="towerCanvas"></canvas>

        <!-- Floor & Multiplier HUD Overlay -->
        <div class="tower-hud-overlay">
          <div class="floor-badge">
            <span>🏢</span>
            <span id="hudFloorCount">Floor 0</span>
          </div>
          <div class="multiplier-badge">
            <span id="hudMultiplierVal">1.00x</span>
          </div>
        </div>

        <!-- Floating Alert Banner (PERFECT, BUST, etc.) -->
        <div class="game-floating-alert" id="gameFloatingAlert"></div>

        <!-- Risk Level Selector -->
        <div class="tower-risk-selector">
          <button class="risk-chip active easy" data-risk="EASY">EASY</button>
          <button class="risk-chip medium" data-risk="MEDIUM">MED</button>
          <button class="risk-chip hard" data-risk="HARD">HARD</button>
        </div>

        <!-- Docked Bottom Controller -->
        <div class="ingame-bet-controller" id="ingameBetController">
          <!-- IDLE VIEW: Stepper & Quick Chips -->
          <div class="controller-inner-left" id="controllerIdleView">
            <div class="bet-stepper-box">
              <button class="stepper-arrow-btn" id="btnBetMinus" title="Decrease Bet">⬇</button>
              <div class="stepper-amount-slot">
                <span class="stepper-amount" id="betAmountDisplay">10</span>
                <span class="stepper-currency">ETB</span>
              </div>
              <button class="stepper-arrow-btn" id="btnBetPlus" title="Increase Bet">⬆</button>
            </div>

            <div class="quick-bet-chips">
              <button class="chip-btn" data-action="2x">2X</button>
              <button class="chip-btn" data-action="4x">4X</button>
              <button class="chip-btn" data-action="allin">ALL IN</button>
            </div>
          </div>

          <!-- RUNNING VIEW: Cash Out Button -->
          <div class="controller-running-view" id="controllerRunningView" style="display: none;">
            <button class="btn-action-collect" id="btnActionCollect">
              <span class="collect-title">CASH OUT</span>
              <span class="collect-amount" id="liveCollectAmount">11.50 ETB</span>
            </button>
          </div>

          <!-- Main Build / Drop Button -->
          <div class="controller-action-wrapper">
            <button class="btn-action-main" id="btnActionMain">
              <span>BUILD</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Desktop Sidebar with Live Players Table -->
      <aside class="game-sidebar-column">
        <div class="sidebar-top-header">
          <span>Live Players</span>
          <span>12:00</span>
        </div>
        <div class="players-table-wrapper custom-scrollbar">
          <table class="players-table">
            <thead>
              <tr>
                <th>Player</th>
                <th>Bet</th>
                <th>Win</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="livePlayersTableBody">
              <tr>
                <td>91***04</td>
                <td>20.0 ETB</td>
                <td class="win">49.00 ETB</td>
                <td>00:44</td>
              </tr>
              <tr>
                <td>37***81</td>
                <td>10.0 ETB</td>
                <td class="win">16.20 ETB</td>
                <td>00:43</td>
              </tr>
              <tr>
                <td>54***12</td>
                <td>50.0 ETB</td>
                <td>-</td>
                <td>00:43</td>
              </tr>
              <tr>
                <td>18***99</td>
                <td>15.0 ETB</td>
                <td class="win">36.75 ETB</td>
                <td>00:42</td>
              </tr>
              <tr>
                <td>82***67</td>
                <td>100.0 ETB</td>
                <td class="win">245.00 ETB</td>
                <td>00:41</td>
              </tr>
            </tbody>
          </table>
        </div>
      </aside>
    </main>
  </div>

  <!-- Shared Balance & Game Scripts -->
  <script src="../../shared-balance.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
